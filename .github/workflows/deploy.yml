name: Deploy to Cloudflare Pages

on:
  push:
    paths:
      - "packages/**"
      - "data/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Scrape MITECO reservoirs"] # must match the name in scrape.yml
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run: only after a successful scrape
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12 # same as scrape.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        id: test
        run: pnpm test

      - name: Generate data (fails if validation fails)
        id: data
        run: pnpm data

      - name: Build web
        id: build
        run: pnpm --filter web build

      - name: Ensure Pages project exists
        # "already exists" is tolerated; a real auth error will fail the deploy step
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create embalses-espana --production-branch=main

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/web/dist --project-name=embalses-espana --branch=${{ env.PAGES_BRANCH }}

      - name: Report failure in an issue
        # only for the production branch; work branches just show a red run
        if: failure() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-fallido";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = "${{ steps.test.outcome == 'failure' && 'tests' || steps.data.outcome == 'failure' && 'validacion de datos' || steps.build.outcome == 'failure' && 'build de la web' || 'despliegue' }}";
            const body = `Ha fallado el paso: **${failed}**. No se ha publicado nada; la web sigue con la ultima version buena.\n\nEjecucion: ${run}`;
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: "d73a4a" });
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label, per_page: 1 });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: "Pipeline fallido: la web no se ha actualizado", body, labels: [label] });
            }
